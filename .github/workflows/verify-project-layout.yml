name: Verify project layout and research pipelines
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/**'
      - 'README.md'
      - '.github/workflows/verify-project-layout.yml'
  push:
    branches:
      - refactor/research-project-layout
    paths:
      - 'projects/**'
      - 'README.md'
      - '.github/workflows/verify-project-layout.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r stage2-rnaseq/requirements.txt scipy matplotlib
      - name: Check eight stage folders, links, copies and Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, py_compile, re
          root=Path("README.md").read_text()
          for n in range(1,9):
              folders=list(Path("projects").glob(f"{n:02d}-*"))
              assert len(folders)==1, f"Expected one stage {n:02d} folder"
              assert (folders[0]/"OVERVIEW.md").is_file(), f"Missing stage {n} overview"
              assert f"**{n:02d}**" in root, f"Stage {n} missing from root README"
          for md in [Path("README.md"),*Path("projects").rglob("OVERVIEW.md")]:
              text=md.read_text()
              for target in re.findall(r"(?<!!)\[[^\]]+\]\(([^)]+)\)",text):
                  if target.startswith(("http:","https:","#","mailto:")): continue
                  assert (md.parent/target.split("#")[0]).exists(),f"Broken link in {md}: {target}"
          pairs={
              "src/train.py":"projects/01-breast-cancer-classification/src/train.py",
              "tests/test_experiment.py":"projects/01-breast-cancer-classification/tests/test_experiment.py",
              "stage2-rnaseq/rnaseq_analysis.py":"projects/02-multicancer-rnaseq/src/rnaseq_analysis.py",
              "stage2-rnaseq/results/rnaseq_metrics.json":"projects/02-multicancer-rnaseq/results/rnaseq_metrics.json",
              "stage2-rnaseq/stage3_stability.py":"projects/03-rnaseq-robustness/src/stage3_stability.py",
              "stage2-rnaseq/results/stage3_stability.json":"projects/03-rnaseq-robustness/results/stage3_stability.json",
              "stage2-rnaseq/stage4_external_audit.py":"projects/04-validation-readiness/src/stage4_external_audit.py",
              "stage2-rnaseq/results/stage4_readiness.json":"projects/04-validation-readiness/results/stage4_readiness.json",
              "stage2-rnaseq/cross_cohort_microarray.py":"projects/05-lung-microarray/src/cross_cohort_microarray.py",
              "stage2-rnaseq/stage6_domain_shift.py":"projects/05-lung-microarray/src/stage6_domain_shift.py",
              "stage2-rnaseq/stage7_third_cohort.py":"projects/05-lung-microarray/src/stage7_third_cohort.py",
              "stage2-rnaseq/stage8_patient_audit.py":"projects/05-lung-microarray/src/stage8_patient_audit.py",
              "stage2-rnaseq/results/stage7_third_cohort.json":"projects/05-lung-microarray/results/stage7_third_cohort.json",
              "stage2-rnaseq/results/source_reproduction_audit.json":"projects/05-lung-microarray/results/source_reproduction_audit.json",
          }
          for src,dst in pairs.items():
              a,b=Path(src),Path(dst)
              assert a.is_file() and b.is_file(),f"Missing: {src} / {dst}"
              assert hashlib.sha256(a.read_bytes()).digest()==hashlib.sha256(b.read_bytes()).digest(),f"Mismatch: {dst}"
          for py in Path("projects").rglob("*.py"):
              py_compile.compile(str(py),doraise=True)
          print("PASS: eight stages, overview links, source copies, and syntax")
          PY
      - name: Run Stage 1 unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Stage 2–8 unit tests
        working-directory: stage2-rnaseq
        run: |
          python -m unittest -v test_rnaseq.py test_stage3.py test_stage4_audit.py test_cross_cohort.py test_stage6.py test_stage7.py test_stage8.py
      - name: Reproduce source-matrix experiments and verify stored metrics
        working-directory: stage2-rnaseq
        run: python reproduce_source_matrices.py
