name: Stage 8 patient independence audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/stage8_patient_audit.py'
      - 'stage2-rnaseq/test_stage8.py'
      - '.github/workflows/stage8-patient-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r stage2-rnaseq/requirements.txt scipy
      - name: Unit tests
        working-directory: stage2-rnaseq
        run: python -m unittest -v test_stage8.py
      - name: Audit patient identity and cluster uncertainty
        working-directory: stage2-rnaseq
        run: python stage8_patient_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage8-patient-independence
          path: stage2-rnaseq/results/stage8_patient_independence_audit.json
          if-no-files-found: error
      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage2-rnaseq/results/stage8_patient_independence_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Stage 8 patient-level audit [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
