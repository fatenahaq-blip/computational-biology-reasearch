name: Publish RNA-Seq figures
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/results/rnaseq_metrics.json'
      - 'stage2-rnaseq/visualize_results.py'
      - '.github/workflows/rnaseq-figures.yml'
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install matplotlib numpy
      - name: Generate figures and research summary
        run: python stage2-rnaseq/visualize_results.py
      - name: Commit figures and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage2-rnaseq/figures stage2-rnaseq/results/research_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish RNA-Seq scientific figures and summary [skip ci]"
            git push
          fi
