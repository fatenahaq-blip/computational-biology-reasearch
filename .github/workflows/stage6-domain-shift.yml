name: Stage 6 domain shift experiment
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/stage6_domain_shift.py'
      - 'stage2-rnaseq/test_stage6.py'
      - '.github/workflows/stage6-domain-shift.yml'
permissions:
  contents: write
concurrency:
  group: stage6-domain-shift
  cancel-in-progress: false
jobs:
  domain-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r stage2-rnaseq/requirements.txt scipy
      - name: Test label-free transforms
        working-directory: stage2-rnaseq
        run: python -m unittest -v test_stage6.py
      - name: Run complete independent-cohort comparison
        working-directory: stage2-rnaseq
        run: python stage6_domain_shift.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage6-domain-shift-results
          path: stage2-rnaseq/results/stage6_domain_shift.json
          if-no-files-found: error
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage2-rnaseq/results/stage6_domain_shift.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Stage 6 domain shift results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
