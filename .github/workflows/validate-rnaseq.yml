name: Validate RNA-Seq research
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/**'
      - '.github/workflows/validate-rnaseq.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stage2-rnaseq/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r stage2-rnaseq/requirements.txt
      - name: Run synthetic-data unit test
        working-directory: stage2-rnaseq
        run: python -m unittest -v test_rnaseq.py
      - name: Execute complete UCI RNA-Seq analysis
        working-directory: stage2-rnaseq
        run: python rnaseq_analysis.py
      - name: Save analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnaseq-evaluation-results
          path: stage2-rnaseq/results/rnaseq_metrics.json
      - name: Publish reproducible metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage2-rnaseq/results/rnaseq_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record validated UCI RNA-Seq metrics [skip ci]"
            git push
          fi
