name: Validate RNA-Seq research
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/**'
      - '.github/workflows/validate-rnaseq.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stage2-rnaseq/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r stage2-rnaseq/requirements.txt
          python -m pip install matplotlib
      - name: Unit tests
        working-directory: stage2-rnaseq
        run: python -m unittest -v test_rnaseq.py
      - name: Full UCI RNA-Seq experiment
        working-directory: stage2-rnaseq
        run: python rnaseq_analysis.py
      - name: Create figures and research summary
        run: python stage2-rnaseq/visualize_results.py
      - name: Upload scientific results
        uses: actions/upload-artifact@v4
        with:
          name: rnaseq-validated-results
          path: |
            stage2-rnaseq/results/rnaseq_metrics.json
            stage2-rnaseq/results/research_summary.md
            stage2-rnaseq/figures/confusion_matrix.png
          if-no-files-found: error
      - name: Commit verified results and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage2-rnaseq/results/rnaseq_metrics.json stage2-rnaseq/results/research_summary.md stage2-rnaseq/figures/confusion_matrix.png
          if ! git diff --cached --quiet; then
            git commit -m "Record verified RNA-Seq analysis and figures [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
