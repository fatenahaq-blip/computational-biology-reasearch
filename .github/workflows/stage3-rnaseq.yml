name: Stage 3 RNA-Seq robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'stage2-rnaseq/stage3_stability.py'
      - 'stage2-rnaseq/test_stage3.py'
      - '.github/workflows/stage3-rnaseq.yml'
permissions:
  contents: write
concurrency:
  group: stage3-rnaseq
  cancel-in-progress: false
jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r stage2-rnaseq/requirements.txt
      - name: Unit tests
        working-directory: stage2-rnaseq
        run: python -m unittest -v test_stage3.py
      - name: Execute full Stage 3 analysis
        working-directory: stage2-rnaseq
        run: python stage3_stability.py
      - name: Upload Stage 3 metrics
        uses: actions/upload-artifact@v4
        with:
          name: stage3-rnaseq-stability
          path: stage2-rnaseq/results/stage3_stability.json
          if-no-files-found: error
      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stage2-rnaseq/results/stage3_stability.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Stage 3 robustness metrics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
